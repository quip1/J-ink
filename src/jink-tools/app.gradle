// Shared Android config for every app module. Each module's build.gradle applies the
// application plugin, then this file, then sets its own namespace and version.
android {
  compileSdk 34
  defaultConfig {
    minSdk 26
    targetSdk 34
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  // The permanent release key comes from environment variables (GitHub secrets in CI), so it is
  // never stored in this public repo. Without them, release builds fall back to the debug key.
  signingConfigs {
    jink {
      def ks = System.getenv('JINK_KEYSTORE')
      if (ks) {
        storeFile file(ks)
        storePassword System.getenv('JINK_KEYSTORE_PASSWORD')
        keyAlias System.getenv('JINK_KEY_ALIAS')
        keyPassword System.getenv('JINK_KEY_PASSWORD')
      }
    }
  }
  buildTypes {
    release {
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), rootProject.file('proguard-rules.pro')
      signingConfig System.getenv('JINK_KEYSTORE') ? signingConfigs.jink : signingConfigs.debug
    }
  }
  lint { abortOnError false; checkReleaseBuilds false }
}
dependencies {
  implementation project(':common')
  testImplementation 'junit:junit:4.13.2'
  // Android's org.json is a stub in local unit tests; this is the real implementation.
  testImplementation 'org.json:json:20240303'
}
