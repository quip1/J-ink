plugins { id 'com.android.library' }
apply from: rootProject.file('native-sources.gradle')

// The whisper.cpp source is fetched before CMake runs (once; then reused from third_party/).
def whisperSrc = fetchNativeSource('whisper')

android {
  namespace 'dev.jacob.aiwhisper'
  compileSdk 34
  defaultConfig {
    minSdk 26
    consumerProguardFiles 'consumer-rules.pro'
    ndk { abiFilters 'arm64-v8a' }   // Boox devices are 64-bit ARM
    externalNativeBuild {
      cmake {
        arguments "-DWHISPER_SRC=${whisperSrc}", '-DANDROID_STL=c++_static', '-DCMAKE_BUILD_TYPE=Release'
      }
    }
  }
  externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
