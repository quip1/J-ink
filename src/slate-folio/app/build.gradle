plugins { id 'com.android.application' }
android {
  namespace 'dev.slate.notes'
  compileSdk 34
  defaultConfig {
    minSdk 26
    targetSdk 34
    ndk { abiFilters 'arm64-v8a' }   // Boox Note Air 6c is ARM64
  }
  buildFeatures { buildConfig true; resValues true }
  flavorDimensions 'app'
  productFlavors {
    slate {
      dimension 'app'
      applicationId 'dev.slate.notes'
      versionCode 7
      versionName '2.1'
      resValue 'string', 'app_name', 'Slate'
      buildConfigField 'boolean', 'READER', 'false'
    }
    folio {
      dimension 'app'
      applicationId 'dev.slate.reader'
      versionCode 1
      versionName '1.0'
      resValue 'string', 'app_name', 'Folio'
      buildConfigField 'boolean', 'READER', 'true'
    }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  buildTypes {
    release {
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      signingConfig signingConfigs.debug
    }
  }
  packaging {
    resources { excludes += ['META-INF/*', 'META-INF/**'] }
    jniLibs { pickFirsts += ['**/libc++_shared.so'] ; useLegacyPackaging true }
  }
  lint { abortOnError false; checkReleaseBuilds false }
}
dependencies {
  implementation 'com.onyx.android.sdk:onyxsdk-device:1.3.6'
  implementation 'com.onyx.android.sdk:onyxsdk-pen:1.5.8'
  implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
  folioImplementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
