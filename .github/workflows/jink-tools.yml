name: Build J-ink Tools

# Builds an APK for every app in src/jink-tools. When the signing secrets are set, the APKs are
# committed to apps/android/jink-tools/ on the branch that was pushed. Without them the APKs are
# only uploaded as a run artifact, so throwaway-signed builds never land in the repo.
on:
  push:
    paths:
      - 'src/jink-tools/**'
      - '.github/workflows/jink-tools.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jink-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit tests
        working-directory: src/jink-tools
        run: gradle testDebugUnitTest --no-daemon

      - name: Load signing key
        env:
          JINK_KEYSTORE_BASE64: ${{ secrets.JINK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$JINK_KEYSTORE_BASE64" ]; then
            echo "$JINK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jink.jks"
            echo "JINK_KEYSTORE=$RUNNER_TEMP/jink.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Signing secrets not set; building with a temporary key and not committing the APKs."
          fi

      - name: Build APKs
        working-directory: src/jink-tools
        env:
          JINK_KEYSTORE_PASSWORD: ${{ secrets.JINK_KEYSTORE_PASSWORD }}
          JINK_KEY_ALIAS: ${{ secrets.JINK_KEY_ALIAS }}
          JINK_KEY_PASSWORD: ${{ secrets.JINK_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          out=apps/android/jink-tools
          rm -rf "$out" && mkdir -p "$out"
          while read -r module name; do
            cp "src/jink-tools/$module/build/outputs/apk/release/$module-release.apk" "$out/$name.apk"
          done <<'EOF'
          inkprint Inkprint
          dice Dice
          initiative Initiative
          charsheet CharacterSheet
          dmgen DMTools
          focus Focus
          readlog ReadLog
          typewriter Typewriter
          journal Journal
          sudoku Sudoku
          solitaire Solitaire
          chess Chess
          wordsearch WordSearch
          filer Filer
          lists Lists
          habits Habits
          calc Calc
          timer Timer
          speak Speak
          feeds Feeds
          weather Weather
          flashcards Flashcards
          scribe Scribe
          EOF
          {
            echo "# J-ink Tools APKs"
            echo
            echo "Built automatically from [\`src/jink-tools\`](../../../src/jink-tools) by the"
            echo "\"Build J-ink Tools\" GitHub Actions workflow, from commit \`${GITHUB_SHA::7}\`."
            echo "Install any of them on your e-ink device; see the main README for how."
            echo
            echo "## Checksums (SHA-256)"
            echo
            echo '```'
            (cd "$out" && sha256sum *.apk)
            echo '```'
          } > "$out/README.md"
          ls -l "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: jink-tools-apks
          path: apps/android/jink-tools/

      # Without the secrets, park the build on a hidden ref (not a branch) so it can be fetched
      # with plain git and signed elsewhere with the permanent key.
      - name: Stage unsigned build
        if: env.SIGNED != 'true'
        run: |
          export GIT_INDEX_FILE="$RUNNER_TEMP/staging-index"
          git add -f apps/android/jink-tools
          tree=$(git write-tree)
          commit=$(git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit-tree "$tree" -m "Unsigned J-ink Tools build from ${GITHUB_SHA::7}")
          git push -f origin "$commit:refs/ci/jink-tools-apks"

      - name: Commit APKs
        if: env.SIGNED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/android/jink-tools
          if git diff --cached --quiet; then
            echo "APKs unchanged"
            exit 0
          fi
          git commit -m "Build J-ink Tools APKs from ${GITHUB_SHA::7}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
